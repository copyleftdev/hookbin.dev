<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hookbin</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div id="app">
  <header id="header">
    <div class="header-left">
      <a href="#/hooks" class="logo">hookbin</a>
      <span id="activity-spinner" class="spinner"></span>
    </div>
    <span id="health-status" class="health-indicator" title="Checking..."></span>
  </header>
  <main id="content">
    <div id="view-hooks" class="view"></div>
    <div id="view-requests" class="view"></div>
    <div id="view-detail" class="view"></div>
    <div id="view-loading" class="view"><p class="empty-state">Loading...</p></div>
  </main>
</div>
<script src="/assets/app.js"></script>
</body>
</html>
